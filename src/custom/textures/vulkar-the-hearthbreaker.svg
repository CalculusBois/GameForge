<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="200" height="160">
  <title>Vulkar, the Hearthbreaker</title>
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <g filter="url(#glow)">
    <!-- Beast Silhouette -->
  <ellipse cx="100" cy="88" rx="80" ry="48" fill="#29201E"/>
  <!-- Fangs & Eyes -->
  <polygon points="60,40 70,64 50,64" fill="#C63B12"/>
  <polygon points="140,40 150,64 130,64" fill="#C63B12"/>
  <circle cx="80" cy="72" r="12" fill="#FFD36A"/>
  <circle cx="120" cy="72" r="12" fill="#FFD36A"/>
  <!-- Claws -->
  <rect x="40" y="128" width="24" height="24" rx="2" fill="#C63B12"/>
  <rect x="136" y="128" width="24" height="24" rx="2" fill="#C63B12"/>
  </g>
</svg>